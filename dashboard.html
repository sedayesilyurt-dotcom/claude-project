<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ── Data Layer — LocalStorage ──

const DB = {
  get(key) {
    try { return JSON.parse(localStorage.getItem(key) || '[]'); }
    catch { return []; }
  },
  set(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
  nextId(arr) { return arr.length ? Math.max(...arr.map(x => x.id)) + 1 : 1; }
};

// Leads
const Leads = {
  all()          { return DB.get('leads'); },
  save(arr)      { DB.set('leads', arr); },
  add(lead)      { const arr = this.all(); lead.id = DB.nextId(arr); lead.createdAt = today(); arr.unshift(lead); this.save(arr); return lead; },
  update(id, d)  { const arr = this.all().map(x => x.id === id ? {...x, ...d} : x); this.save(arr); },
  remove(id)     { this.save(this.all().filter(x => x.id !== id)); },
  find(id)       { return this.all().find(x => x.id === id); }
};

// Meetings
const Meetings = {
  all()          { return DB.get('meetings'); },
  save(arr)      { DB.set('meetings', arr); },
  add(m)         { const arr = this.all(); m.id = DB.nextId(arr); arr.unshift(m); this.save(arr); return m; },
  update(id, d)  { const arr = this.all().map(x => x.id === id ? {...x, ...d} : x); this.save(arr); },
  remove(id)     { this.save(this.all().filter(x => x.id !== id)); },
  find(id)       { return this.all().find(x => x.id === id); }
};

// Customers
const Customers = {
  all()          { return DB.get('customers'); },
  save(arr)      { DB.set('customers', arr); },
  add(c)         { const arr = this.all(); c.id = DB.nextId(arr); c.createdAt = today(); arr.unshift(c); this.save(arr); return c; },
  update(id, d)  { const arr = this.all().map(x => x.id === id ? {...x, ...d} : x); this.save(arr); },
  remove(id)     { this.save(this.all().filter(x => x.id !== id)); },
  find(id)       { return this.all().find(x => x.id === id); }
};

// Payments
const Payments = {
  all()          { return DB.get('payments'); },
  save(arr)      { DB.set('payments', arr); },
  add(p)         { const arr = this.all(); p.id = DB.nextId(arr); arr.unshift(p); this.save(arr); return p; },
  update(id, d)  { const arr = this.all().map(x => x.id === id ? {...x, ...d} : x); this.save(arr); },
  remove(id)     { this.save(this.all().filter(x => x.id !== id)); },
  find(id)       { return this.all().find(x => x.id === id); }
};

// Services
const Services = {
  all()          { return DB.get('services'); },
  save(arr)      { DB.set('services', arr); },
  add(s)         { const arr = this.all(); s.id = DB.nextId(arr); arr.unshift(s); this.save(arr); return s; },
  update(id, d)  { const arr = this.all().map(x => x.id === id ? {...x, ...d} : x); this.save(arr); },
  remove(id)     { this.save(this.all().filter(x => x.id !== id)); },
  find(id)       { return this.all().find(x => x.id === id); }
};

// Settings
const Settings = {
  get()   { try { return JSON.parse(localStorage.getItem('settings') || '{}'); } catch { return {}; } },
  save(s) { localStorage.setItem('settings', JSON.stringify(s)); }
};

// ── Constants ──
const LEAD_SOURCES = [
  'WhatsApp Reklamı', 'Instagram DM Reklamı', 'Facebook Form Reklamı',
  'Web Site Formu', 'Organik Başvuru'
];
const LEAD_STATUS = [
  { val: 'yeni',      label: 'Yeni Lead',           cls: 'badge-blue'   },
  { val: 'iletisim',  label: 'İletişime Geçildi',   cls: 'badge-yellow' },
  { val: 'gorusme',   label: 'Görüşme Yapıldı',     cls: 'badge-purple' },
  { val: 'toplanti',  label: 'Toplantı Planlandı',  cls: 'badge-orange' },
  { val: 'satis',     label: 'Satış Yapıldı',       cls: 'badge-green'  },
  { val: 'donusmsuz', label: 'Dönüşüm Olmadı',      cls: 'badge-red'    }
];
const MEETING_TYPES = ['Zoom', 'Telefon Görüşmesi', 'WhatsApp Görüşmesi', 'Yüz Yüze'];
const MEETING_STATUS = [
  { val: 'planlandi',  label: 'Planlandı',     cls: 'badge-blue'   },
  { val: 'tamamlandi', label: 'Tamamlandı',    cls: 'badge-green'  },
  { val: 'iptal',      label: 'İptal Edildi',  cls: 'badge-red'    }
];
const SECTORS = ['Güzellik Merkezi', 'Emlak Danışmanı', 'Psikolog', 'Diyetisyen', 'Mobilya', 'Kuaför', 'Diğer'];
const SERVICE_LIST = [
  'Meta Reklam Yönetimi', 'Sosyal Medya Yönetimi', 'Danışmanlık',
  'İçerik Stratejisi', 'Eğitim', 'Reklam Kurulumu', 'Funnel Kurulumu', 'Diğer'
];
const CUSTOMER_STATUS = [
  { val: 'aktif',   label: 'Aktif',    cls: 'badge-green'  },
  { val: 'pasif',   label: 'Pasif',    cls: 'badge-gray'   },
  { val: 'duraklat',label: 'Duraklatıldı', cls: 'badge-yellow' }
];
const PAYMENT_STATUS = [
  { val: 'odendi',   label: 'Ödendi',   cls: 'badge-green'  },
  { val: 'bekliyor', label: 'Bekliyor', cls: 'badge-yellow' },
  { val: 'gecikti',  label: 'Gecikti',  cls: 'badge-red'    }
];

// ── Helpers ──
function today() { return new Date().toLocaleDateString('tr-TR'); }

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('tr-TR', {day:'2-digit', month:'2-digit', year:'numeric'});
}

function fmtMoney(n) {
  if (!n && n !== 0) return '—';
  return Number(n).toLocaleString('tr-TR') + ' ₺';
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function badgeFor(arr, val) {
  const found = arr.find(x => x.val === val);
  return found ? `<span class="badge ${found.cls}">${found.label}</span>` : `<span class="badge badge-gray">${val}</span>`;
}

function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
}

function getMonthName(i) {
  return ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'][i];
}
function renderOverview() {
  const leads    = Leads.all();
  const meetings = Meetings.all();
  const customers = Customers.all();
  const payments  = Payments.all();

  const todayStr = today();
  const todayLeads = leads.filter(l => l.createdAt === todayStr).length;
  const contacted  = leads.filter(l => l.status !== 'yeni').length;
  const activeCust = customers.filter(c => c.status === 'aktif').length;
  const upcomingM  = meetings.filter(m => m.status === 'planlandi').length;
  const pending    = payments.filter(p => p.status === 'bekliyor' || p.status === 'gecikti');
  const pendingAmt = pending.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  const collected  = payments.filter(p => p.status === 'odendi').reduce((s, p) => s + (Number(p.amount) || 0), 0);

  const recentLeads = leads.slice(0, 5);
  const upcomingMeetings = meetings.filter(m => m.status === 'planlandi').slice(0, 5);

  return `
  <div class="page">
    <div class="stat-grid">
      ${statCard('c1','📋', leads.length, 'Toplam Lead')}
      ${statCard('c2','📅', todayLeads, 'Bugün Gelen Lead')}
      ${statCard('c3','💬', contacted, 'Görüşülen Lead')}
      ${statCard('c4','🗓️', upcomingM, 'Planlanan Toplantı')}
      ${statCard('c5','👥', activeCust, 'Aktif Müşteri')}
      ${statCard('c6','⏳', fmtMoney(pendingAmt), 'Bekleyen Tahsilat')}
      ${statCard('c7','💰', fmtMoney(collected), 'Toplam Tahsilat')}
    </div>

    <div class="grid2">
      <div class="section-card">
        <div class="section-header">
          <h2>Son Leadler</h2>
          <button class="btn btn-ghost btn-sm" onclick="App.nav('leads')">Tümünü Gör →</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Ad Soyad</th><th>Kaynak</th><th>Durum</th><th>Tarih</th></tr></thead>
            <tbody>
              ${recentLeads.length ? recentLeads.map(l => `
                <tr>
                  <td class="font-bold">${esc(l.name)}</td>
                  <td class="text-muted">${esc(l.source)}</td>
                  <td>${badgeFor(LEAD_STATUS, l.status)}</td>
                  <td class="text-muted">${l.createdAt || '—'}</td>
                </tr>`).join('') : `<tr><td colspan="4" class="table-empty">Henüz lead yok</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="section-card">
        <div class="section-header">
          <h2>Yaklaşan Toplantılar</h2>
          <button class="btn btn-ghost btn-sm" onclick="App.nav('meetings')">Tümünü Gör →</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Müşteri</th><th>Tür</th><th>Tarih / Saat</th></tr></thead>
            <tbody>
              ${upcomingMeetings.length ? upcomingMeetings.map(m => `
                <tr>
                  <td class="font-bold">${esc(m.client)}</td>
                  <td class="text-muted">${esc(m.type)}</td>
                  <td class="text-muted">${fmtDate(m.date)} ${m.time || ''}</td>
                </tr>`).join('') : `<tr><td colspan="3" class="table-empty">Planlanmış toplantı yok</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header">
        <h2>Lead Kaynağı Dağılımı</h2>
      </div>
      <div class="section-body">
        ${renderSourceBars(leads)}
      </div>
    </div>
  </div>`;
}

function statCard(cls, icon, value, label) {
  return `
  <div class="stat-card ${cls}">
    <div class="sc-icon">${icon}</div>
    <div>
      <div class="sc-value">${value}</div>
      <div class="sc-label">${label}</div>
    </div>
  </div>`;
}

function renderSourceBars(leads) {
  if (!leads.length) return '<p class="text-muted">Veri yok.</p>';
  const counts = {};
  LEAD_SOURCES.forEach(s => counts[s] = 0);
  leads.forEach(l => { if (counts[l.source] !== undefined) counts[l.source]++; });
  const max = Math.max(...Object.values(counts), 1);
  const colors = ['#c4637a','#d4889e','#e8a4b8','#f0c4d0','#f7dce5'];
  return `<div style="display:flex;flex-direction:column;gap:12px">` +
    Object.entries(counts).map(([src, cnt], i) => `
      <div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span class="text-sm">${src}</span>
          <span class="text-sm font-bold">${cnt}</span>
        </div>
        <div style="background:var(--bg2);border-radius:20px;height:8px;overflow:hidden">
          <div style="background:${colors[i % colors.length]};height:100%;width:${(cnt/max)*100}%;border-radius:20px;transition:width .5s"></div>
        </div>
      </div>`).join('') + `</div>`;
}
function renderLeads() {
  return `
  <div class="page">
    <div class="section-card" style="margin-bottom:20px">
      <div class="section-header">
        <h2>Yeni Lead Ekle</h2>
        <button class="btn btn-ghost btn-sm" id="toggle-lead-form">Formu Aç / Kapat</button>
      </div>
      <div class="section-body" id="lead-form-wrap">
        <form onsubmit="submitLead(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>Ad Soyad *</label>
              <input name="name" placeholder="Ad Soyad" required />
            </div>
            <div class="form-group">
              <label>Telefon *</label>
              <input name="phone" type="tel" placeholder="05XX XXX XX XX" required />
            </div>
            <div class="form-group">
              <label>E-posta</label>
              <input name="email" type="email" placeholder="ornek@mail.com" />
            </div>
            <div class="form-group">
              <label>Reklam Kaynağı *</label>
              <select name="source" required>
                <option value="">Seçiniz</option>
                ${LEAD_SOURCES.map(s => `<option>${s}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Durum</label>
              <select name="status">
                ${LEAD_STATUS.map(s => `<option value="${s.val}">${s.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-group" style="grid-column:1/-1">
              <label>Not</label>
              <textarea name="note" placeholder="Lead hakkında notlarınız..."></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Lead Ekle</button>
            <button type="reset" class="btn btn-ghost">Temizle</button>
          </div>
        </form>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header">
        <h2>Lead Listesi <span id="lead-count" class="text-muted text-sm"></span></h2>
      </div>
      <div class="section-body">
        <div class="toolbar">
          <input class="search" type="text" placeholder="🔍  İsim veya telefon ara..." id="lead-search" oninput="filterLeads()" />
          <select id="lead-filter-source" onchange="filterLeads()">
            <option value="">Tüm Kaynaklar</option>
            ${LEAD_SOURCES.map(s => `<option>${s}</option>`).join('')}

          <select id="lead-filter-status" onchange="filterLeads()">
            <option value="">Tüm Durumlar</option>
            ${LEAD_STATUS.map(s => `<option value="${s.val}">${s.label}</option>`).join('')}
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Ad Soyad</th>
                <th>Telefon</th>
                <th>E-posta</th>
                <th>Kaynak</th>
                <th>Durum</th>
                <th>Tarih</th>
                <th>Not</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="leads-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="lead-modal">
      <div class="modal">
        <div class="modal-header">
          <h3>Lead Düzenle</h3>
          <button class="modal-close" onclick="closeModal('lead-modal')">✕</button>
        </div>
        <div class="modal-body">
          <form onsubmit="updateLead(event)">
            <input type="hidden" id="edit-lead-id" />
            <div class="form-grid">
              <div class="form-group">
                <label>Ad Soyad *</label>
                <input id="edit-lead-name" required />
              </div>
              <div class="form-group">
                <label>Telefon *</label>
                <input id="edit-lead-phone" required />
              </div>
              <div class="form-group">
                <label>E-posta</label>
                <input id="edit-lead-email" type="email" />
              </div>
              <div class="form-group">
                <label>Kaynak</label>
                <select id="edit-lead-source">
                  ${LEAD_SOURCES.map(s => `<option>${s}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label>Durum</label>
                <select id="edit-lead-status">
                  ${LEAD_STATUS.map(s => `<option value="${s.val}">${s.label}</option>`).join('')}
                </select>
              </div>
              <div class="form-group" style="grid-column:1/-1">
                <label>Not</label>
                <textarea id="edit-lead-note"></textarea>
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Güncelle</button>
              <button type="button" class="btn btn-ghost" onclick="closeModal('lead-modal')">İptal</button>

}

function initLeads() {
  renderLeadsTable();

  document.getElementById('toggle-lead-form').onclick = () => {
    const w = document.getElementById('lead-form-wrap');
    w.classList.toggle('hidden');
  };
}

function submitLead(e) {
  e.preventDefault();
  const f = e.target;
  Leads.add({
    name: f.name.value.trim(),
    phone: f.phone.value.trim(),
    email: f.email.value.trim(),
    source: f.source.value,
    status: f.status.value,
    note: f.note.value.trim()
  });
  f.reset();
  renderLeadsTable();
  App.refreshBadge();
}

function renderLeadsTable() {
  const q   = (document.getElementById('lead-search')?.value || '').toLowerCase();
  const src = document.getElementById('lead-filter-source')?.value || '';
  const st  = document.getElementById('lead-filter-status')?.value || '';

  let leads = Leads.all().filter(l =>
    (!q   || l.name.toLowerCase().includes(q) || (l.phone||'').includes(q)) &&
    (!src || l.source === src) &&
    (!st  || l.status === st)
  );

  const cnt = document.getElementById('lead-count');
  if (cnt) cnt.textContent = `(${leads.length})`;

  const tbody = document.getElementById('leads-tbody');
  if (!tbody) return;

  if (!leads.length) {
    tbody.innerHTML = `<tr><td colspan="9" class="table-empty">Lead bulunamadı.</td></tr>`;
    return;
  }

  tbody.innerHTML = leads.map((l, i) => `
    <tr>
      <td class="text-muted">${i+1}</td>
      <td class="font-bold">${esc(l.name)}</td>
      <td>${esc(l.phone)}</td>
      <td class="text-muted">${esc(l.email) || '—'}</td>
      <td><span class="badge badge-pink">${esc(l.source)}</span></td>
      <td>
        <select onchange="quickStatusLead(${l.id}, this.value)" style="border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.78rem;background:var(--white)">
          ${LEAD_STATUS.map(s => `<option value="${s.val}" ${l.status===s.val?'selected':''}>${s.label}</option>`).join('')}
        </select>
      </td>
      <td class="text-muted">${l.createdAt || '—'}</td>
      <td style="max-width:140px">
        ${l.note ? `<div class="note-box">${esc(l.note.slice(0,60))}${l.note.length>60?'…':''}</div>` : '<span class="text-muted">—</span>'}
      </td>
      <td>
        <div class="flex gap-8">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="editLead(${l.id})" title="Düzenle">✏️</button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="deleteLead(${l.id})" title="Sil">🗑️</button>
        </div>
      </td>
    </tr>`).join('');
}

function filterLeads() { renderLeadsTable(); }

function quickStatusLead(id, val) {
  Leads.update(id, { status: val });
  App.refreshBadge();
}

function editLead(id) {
  const l = Leads.find(id);
  if (!l) return;
  document.getElementById('edit-lead-id').value    = l.id;

function submitMeeting(e) {
  e.preventDefault();
  const f = e.target;
  Meetings.add({
    client: f.client.value.trim(),
    date:   f.date.value,
    time:   f.time.value,
    type:   f.type.value,
    status: f.status.value,
    note:   f.note.value.trim()
  });
  f.reset();
  renderMeetingsTable();
}

function renderMeetingsTable() {
  const q   = (document.getElementById('meeting-search')?.value || '').toLowerCase();
  const tp  = document.getElementById('meeting-filter-type')?.value || '';
  const st  = document.getElementById('meeting-filter-status')?.value || '';

  let meetings = Meetings.all().filter(m =>
    (!q  || m.client.toLowerCase().includes(q)) &&
    (!tp || m.type === tp) &&
    (!st || m.status === st)
  );

  const cnt = document.getElementById('meeting-count');
  if (cnt) cnt.textContent = `(${meetings.length})`;

  const tbody = document.getElementById('meetings-tbody');
  if (!tbody) return;

  if (!meetings.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="table-empty">Toplantı bulunamadı.</td></tr>`;
    return;
  }

  tbody.innerHTML = meetings.map((m, i) => `
    <tr>
      <td class="text-muted">${i+1}</td>
      <td class="font-bold">${esc(m.client)}</td>
      <td>${fmtDate(m.date)}</td>
      <td>${m.time || '—'}</td>
      <td><span class="badge badge-pink">${esc(m.type)}</span></td>
      <td>
        <select onchange="quickStatusMeeting(${m.id}, this.value)" style="border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.78rem;background:var(--white)">
          ${MEETING_STATUS.map(s => `<option value="${s.val}" ${m.status===s.val?'selected':''}>${s.label}</option>`).join('')}
        </select>
      </td>
      <td style="max-width:160px">
        ${m.note ? `<div class="note-box">${esc(m.note.slice(0,60))}${m.note.length>60?'…':''}</div>` : '<span class="text-muted">—</span>'}
      </td>
      <td>
        <div class="flex gap-8">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="editMeeting(${m.id})">✏️</button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="deleteMeeting(${m.id})">🗑️</button>
        </div>
      </td>
    </tr>`).join('');
}

  const st  = document.getElementById('customer-filter-status')?.value || '';

  let customers = Customers.all().filter(c =>
    (!q   || c.name.toLowerCase().includes(q) || (c.business||'').toLowerCase().includes(q)) &&
    (!sec || c.sector === sec) &&
    (!st  || c.status === st)
  );

  const cnt = document.getElementById('customer-count');
  if (cnt) cnt.textContent = `(${customers.length})`;

  const grid = document.getElementById('customer-grid');

  if (!customers.length) {

function initPayments() {

function renderPaymentSummary() {
  const payments = Payments.all();
  const collected = payments.filter(p => p.status === 'odendi').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const pending   = payments.filter(p => p.status === 'bekliyor').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const overdue   = payments.filter(p => p.status === 'gecikti').reduce((s,p) => s + (Number(p.amount)||0), 0);
  const wrap = document.getElementById('payment-summary-wrap');
  if (wrap) wrap.innerHTML = `
    <div class="payment-summary">
      <div class="pay-sum-card green">
        <div class="psc-label">💰 Toplam Tahsilat</div>
        <div class="psc-value">${fmtMoney(collected)}</div>
      </div>
      <div class="pay-sum-card orange">
        <div class="psc-label">⏳ Bekleyen Tahsilat</div>
        <div class="psc-value">${fmtMoney(pending)}</div>
      </div>
      <div class="pay-sum-card red">
        <div class="psc-label">⚠️ Geciken Tahsilat</div>
        <div class="psc-value">${fmtMoney(overdue)}</div>
      </div>
    </div>`;
}

function submitPayment(e) {
  e.preventDefault();
  const f = e.target;
  Payments.add({
    client:      f.client.value.trim(),
    service:     f.service.value,
    amount:      Number(f.amount.value),
    invoiceDate: f.invoiceDate.value,
    dueDate:     f.dueDate.value,
    status:      f.status.value
  });
  f.reset();
  renderPaymentSummary();
  renderPaymentsTable();
}

function renderPaymentsTable() {
  const q  = (document.getElementById('payment-search')?.value || '').toLowerCase();
  const st = document.getElementById('payment-filter-status')?.value || '';

  let payments = Payments.all().filter(p =>
    (!q  || p.client.toLowerCase().includes(q)) &&
    (!st || p.status === st)
  );

  const cnt = document.getElementById('payment-count');
  if (cnt) cnt.textContent = `(${payments.length})`;

  const tbody = document.getElementById('payments-tbody');
  if (!tbody) return;

  if (!payments.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="table-empty">Ödeme bulunamadı.</td></tr>`;
    return;
  }

  tbody.innerHTML = payments.map((p, i) => `
    <tr>
      <td class="text-muted">${i+1}</td>
      <td class="font-bold">${esc(p.client)}</td>
      <td class="text-muted">${esc(p.service)}</td>
      <td class="font-bold" style="color:var(--primary)">${fmtMoney(p.amount)}</td>
      <td class="text-muted">${fmtDate(p.invoiceDate)}</td>
      <td class="text-muted">${fmtDate(p.dueDate)}</td>
      <td>
        <select onchange="quickStatusPayment(${p.id}, this.value)" style="border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.78rem;background:var(--white)">
          ${PAYMENT_STATUS.map(s => `<option value="${s.val}" ${p.status===s.val?'selected':''}>${s.label}</option>`).join('')}
        </select>
      </td>
      <td>
        <div class="flex gap-8">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="editPayment(${p.id})">✏️</button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="deletePayment(${p.id})">🗑️</button>
        </div>
      </td>
    </tr>`).join('');
}

function filterPayments() { renderPaymentsTable(); }

function quickStatusPayment(id, val) {
  Payments.update(id, { status: val });
  renderPaymentSummary();

function editPayment(id) {
  const p = Payments.find(id);

  document.getElementById('edit-payment-id').value      = p.id;

  document.getElementById('edit-payment-service').value = p.service;

const COLORS = ['#c4637a','#d4889e','#e8a4b8','#f0c4d0','#a84f64','#f7dce5','#854f64','#ddb0bc'];

function buildSourceChart() {
  const leads = Leads.all();
  const counts = LEAD_SOURCES.map(s => leads.filter(l => l.source === s).length);
  const ctx = document.getElementById('chart-sources');
  if (!ctx) return;
  new Chart(ctx, {
    type: 'doughnut',
    data: { labels: LEAD_SOURCES, datasets: [{ data: counts, backgroundColor: COLORS, borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12 } } } }
  });
}

function buildConversionChart() {
  const leads = Leads.all();
  const labels = LEAD_STATUS.map(s => s.label);
  const counts = LEAD_STATUS.map(s => leads.filter(l => l.status === s.val).length);
  const ctx = document.getElementById('chart-conversion');
  if (!ctx) return;
  new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Lead Sayısı', data: counts, backgroundColor: COLORS, borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } }, x: { ticks: { font: { size: 10 } } } } }
  });
}

function buildMonthlyChart() {
  const customers = Customers.all();
  const now = new Date();
  const months = Array.from({length: 6}, (_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 1);
    return { label: getMonthName(d.getMonth()), year: d.getFullYear(), month: d.getMonth() };
  });
  const counts = months.map(m =>
    customers.filter(c => {
      if (!c.createdAt) return false;
      const parts = c.createdAt.split('.');
      if (parts.length < 3) return false;
      const d = new Date(parts[2], parts[1]-1, parts[0]);
      return d.getFullYear() === m.year && d.getMonth() === m.month;
    }).length
  );
  const ctx = document.getElementById('chart-monthly');
  if (!ctx) return;
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: months.map(m => m.label),
      datasets: [{ label: 'Yeni Müşteri', data: counts, borderColor: '#c4637a', backgroundColor: 'rgba(196,99,122,.12)', tension: .4, fill: true, pointBackgroundColor: '#c4637a', pointRadius: 5 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });
}

function buildServicesChart() {
  const svcRecords = Services.all();
  const counts = SERVICE_LIST.map(s => svcRecords.filter(r => r.type === s).length);
  const ctx = document.getElementById('chart-services');
  if (!ctx) return;
  new Chart(ctx, {
    type: 'doughnut',
    data: { labels: SERVICE_LIST, datasets: [{ data: counts, backgroundColor: COLORS, borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 }, boxWidth: 12 } } } }
  });
}

function buildPaymentsChart() {
  const payments = Payments.all();
  const now = new Date();
  const months = Array.from({length: 6}, (_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 1);
    return { label: getMonthName(d.getMonth()), year: d.getFullYear(), month: d.getMonth() };
  });
  const collected = months.map(m =>
    payments.filter(p => {
      if (p.status !== 'odendi' || !p.invoiceDate) return false;
      const d = new Date(p.invoiceDate);
      return d.getFullYear() === m.year && d.getMonth() === m.month;
    }).reduce((s, p) => s + (Number(p.amount)||0), 0)
  );
  const ctx = document.getElementById('chart-payments');
  if (!ctx) return;
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: months.map(m => m.label),
      datasets: [{ label: 'Tahsilat (₺)', data: collected, backgroundColor: 'rgba(196,99,122,.7)', borderRadius: 6, borderSkipped: false }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

                  <option value="USD" ${s.currency==='USD'?'selected':''}>$ Dolar</option>
                  <option value="EUR" ${s.currency==='EUR'?'selected':''}>€ Euro</option>
                </select>
              </div>
              <div class="form-group">
                <label>Hakkında / Bio</label>
                <textarea id="s-bio" placeholder="Kendiniz hakkında kısa bir not...">${esc(s.bio||'')}</textarea>
              </div>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 Kaydet</button>
          </div>
        </form>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header"><h2>🗂️ Veri Yönetimi</h2></div>
      <div class="section-body">
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn btn-outline" onclick="exportData()">📥 Veriyi Dışa Aktar (JSON)</button>
          <button class="btn btn-ghost" onclick="document.getElementById('import-file').click()">📤 Veri İçe Aktar</button>
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)" />
          <button class="btn btn-danger" onclick="clearAllData()">🗑️ Tüm Verileri Sil</button>
        </div>
        <p class="text-muted mt-8">Veriler tarayıcınızın LocalStorage alanında saklanmaktadır. Farklı bir cihazda kullanmak için JSON ile dışa aktarın.</p>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header"><h2>ℹ️ Hakkında</h2></div>
      <div class="section-body">
        <p class="text-sm" style="color:var(--text-muted);line-height:1.7">
          <strong>Reklam & Müşteri Yönetim Dashboard'u</strong><br>
          Sosyal medya ve Meta reklam uzmanları için tasarlanmış iş akışı yönetim aracı.<br>
          Versiyon 1.0 — Tüm veriler yerel olarak saklanmaktadır.
        </p>
      </div>
    </div>
  </div>`;
}

function initSettings() {}

function saveSettings(e) {
  e.preventDefault();
  Settings.save({
    name:     document.getElementById('s-name').value.trim(),
    email:    document.getElementById('s-email').value.trim(),
    phone:    document.getElementById('s-phone').value.trim(),
    company:  document.getElementById('s-company').value.trim(),
    currency: document.getElementById('s-currency').value,
    bio:      document.getElementById('s-bio').value.trim()
  });
  App.updateUserInfo();
  showToast('Ayarlar kaydedildi ✓');
}

function exportData() {
  const data = {
    leads:     Leads.all(),
    meetings:  Meetings.all(),
    customers: Customers.all(),
    payments:  Payments.all(),
    services:  Services.all(),
    settings:  Settings.get(),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `dashboard-yedek-${new Date().toLocaleDateString('tr-TR').replace(/\./g,'-')}.json`;
  a.click();
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.leads)     DB.set('leads',     data.leads);
      if (data.meetings)  DB.set('meetings',  data.meetings);
      if (data.customers) DB.set('customers', data.customers);
      if (data.payments)  DB.set('payments',  data.payments);
      if (data.services)  DB.set('services',  data.services);
      if (data.settings)  DB.set('settings',  data.settings);
      showToast('Veriler başarıyla içe aktarıldı ✓');
      App.nav('overview');
    } catch {
      alert('Geçersiz dosya formatı!');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function clearAllData() {
  if (!confirm('Tüm veriler silinecek! Bu işlem geri alınamaz. Devam etmek istiyor musunuz?')) return;
  ['leads','meetings','customers','payments','services'].forEach(k => localStorage.removeItem(k));
  showToast('Tüm veriler silindi.');
  App.nav('overview');
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#2d2d2d;color:white;padding:12px 20px;border-radius:10px;font-size:.85rem;font-weight:600;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 3000);
}
const PAGES = {
  overview:  { title: 'Genel Bakış',        render: renderOverview,  init: null          },
  leads:     { title: 'Reklam Leadleri',     render: renderLeads,     init: initLeads     },
  customers: { title: 'Mevcut Müşteriler',   render: renderCustomers, init: initCustomers },
  meetings:  { title: 'Toplantılar',         render: renderMeetings,  init: initMeetings  },
  payments:  { title: 'Ödemeler',            render: renderPayments,  init: initPayments  },
  services:  { title: 'Hizmetler',           render: renderServices,  init: initServices  },
  reports:   { title: 'Raporlar',            render: renderReports,   init: initReports   },
  settings:  { title: 'Ayarlar',             render: renderSettings,  init: initSettings  }
};

const App = {
  current: 'overview',

  init() {
    this.updateUserInfo();
    this.nav('overview');
    this.refreshBadge();

    document.getElementById('hamburger').onclick = () => this.toggleSidebar();
    document.getElementById('sidebar-overlay').onclick = () => this.closeSidebar();
  },

  nav(page) {
    if (!PAGES[page]) return;
    this.current = page;

    // update active nav
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.page === page);
    });

    // update page title
    document.getElementById('page-title').textContent = PAGES[page].title;

    // render content
    document.getElementById('content').innerHTML = PAGES[page].render();

    // run init
    if (PAGES[page].init) PAGES[page].init();

    this.closeSidebar();
    window.scrollTo(0, 0);
  },

  toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('open');
  },

  closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  },

  refreshBadge() {
    const newLeads = Leads.all().filter(l => l.status === 'yeni').length;
    const badge = document.getElementById('lead-badge');
    if (badge) {
      badge.textContent = newLeads;
      badge.style.display = newLeads ? 'inline' : 'none';
    }
  },

  updateUserInfo() {
    const s = Settings.get();
    const name = s.name || 'Kullanıcı';
    const el = document.getElementById('user-name');
    if (el) el.textContent = name;
    const av = document.getElementById('user-avatar');
    if (av) av.textContent = initials(name);
  }
};

// Modal helpers
function openModal(id) {
  document.getElementById(id)?.classList.add('open');
}
function closeModal(id) {
  document.getElementById(id)?.classList.remove('open');
}

// Close modal on overlay click
document.addEventListener('click', e => {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('open');
  }
});

// Close modal on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
  }
});

document.addEventListener('DOMContentLoaded', () => App.init());
document.getElementById('topbar-date').textContent =
  new Date().toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric', weekday:'long'});
</script>
</body>
