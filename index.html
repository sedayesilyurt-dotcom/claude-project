<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reklam & Müşteri Yönetim Dashboard'u</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🌸</div>
      <div>
        <div class="logo-text">AdManager</div>
        <div class="logo-sub">Reklam & Müşteri Paneli</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-nav-group">
        <div class="sidebar-nav-label">Ana Menü</div>
        <div class="nav-item active" data-page="overview" onclick="App.nav('overview')">
          <span class="nav-icon">🏠</span> Genel Bakış
        </div>
        <div class="nav-item" data-page="leads" onclick="App.nav('leads')">
          <span class="nav-icon">📋</span> Reklam Leadleri
          <span class="nav-badge" id="lead-badge" style="display:none">0</span>
        </div>
        <div class="nav-item" data-page="customers" onclick="App.nav('customers')">
          <span class="nav-icon">👥</span> Mevcut Müşteriler
        </div>
        <div class="nav-item" data-page="meetings" onclick="App.nav('meetings')">
          <span class="nav-icon">🗓️</span> Toplantılar
        </div>
      </div>

      <div class="sidebar-nav-group">
        <div class="sidebar-nav-label">Finans & Hizmet</div>
        <div class="nav-item" data-page="payments" onclick="App.nav('payments')">
          <span class="nav-icon">💰</span> Ödemeler
        </div>
        <div class="nav-item" data-page="services" onclick="App.nav('services')">
          <span class="nav-icon">🛠️</span> Hizmetler
        </div>
      </div>

      <div class="sidebar-nav-group">
        <div class="sidebar-nav-label">Analiz</div>
        <div class="nav-item" data-page="reports" onclick="App.nav('reports')">
          <span class="nav-icon">📊</span> Raporlar
        </div>
        <div class="nav-item" data-page="settings" onclick="App.nav('settings')">
          <span class="nav-icon">⚙️</span> Ayarlar
        </div>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="avatar" id="user-avatar">K</div>
      <div>
        <div style="font-weight:600;color:var(--text);font-size:.82rem" id="user-name">Kullanıcı</div>
        <div>Reklam Uzmanı</div>
      </div>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="hamburger" id="hamburger">
          <span></span><span></span><span></span>
        </div>
        <div class="page-title" id="page-title">Genel Bakış</div>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
        <button class="topbar-btn" onclick="App.nav('settings')" title="Ayarlar">⚙️</button>
      </div>
    </header>

    <main class="content" id="content">
      <!-- Dynamic content -->
    </main>
  </div>

</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- Data layer -->
<script src="js/data.js"></script>

<!-- Page modules -->
<script src="js/pages/overview.js"></script>
<script src="js/pages/leads.js"></script>
<script src="js/pages/meetings.js"></script>
<script src="js/pages/customers.js"></script>
<script src="js/pages/payments.js"></script>
<script src="js/pages/services.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/settings.js"></script>

<!-- App router -->
<script src="js/app.js"></script>

<script>
  document.getElementById('topbar-date').textContent =
    new Date().toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric', weekday:'long'});
</script>

</body>
</html>
