<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Müşteri Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }

    header {
      background: #1e3a5f;
      color: white;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.3rem; font-weight: 600; }

    .container { max-width: 1100px; margin: 32px auto; padding: 0 16px; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: white; border-radius: 10px; padding: 20px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .stat-card .label { font-size: .78rem; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: #1e3a5f; margin-top: 4px; }
    .stat-card .value.green { color: #16a34a; }
    .stat-card .value.yellow { color: #d97706; }
    .stat-card .value.red { color: #dc2626; }

    .card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 24px; margin-bottom: 24px; }
    .card h2 { font-size: 1rem; font-weight: 600; color: #374151; margin-bottom: 16px; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .form-group label { display: block; font-size: .82rem; font-weight: 500; color: #374151; margin-bottom: 5px; }
    .form-group input, .form-group select {
      width: 100%; padding: 9px 12px; border: 1px solid #d1d5db;
      border-radius: 7px; font-size: .92rem; color: #111;
      transition: border-color .2s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none; border-color: #1e3a5f; box-shadow: 0 0 0 3px rgba(30,58,95,.1);
    }
    .btn {
      margin-top: 18px; padding: 10px 24px; background: #1e3a5f;
      color: white; border: none; border-radius: 7px; font-size: .92rem;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .btn:hover { background: #16304f; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    thead th {
      background: #f8fafc; text-align: left; padding: 11px 14px;
      font-size: .78rem; font-weight: 600; color: #6b7280;
      text-transform: uppercase; letter-spacing: .05em;
      border-bottom: 1px solid #e5e7eb;
    }
    tbody tr { border-bottom: 1px solid #f3f4f6; transition: background .15s; }
    tbody tr:hover { background: #f9fafb; }
    tbody td { padding: 12px 14px; color: #374151; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      font-size: .78rem; font-weight: 600;
    }
    .badge.yeni       { background: #dbeafe; color: #1d4ed8; }
    .badge.gorusme    { background: #fef9c3; color: #92400e; }
    .badge.tamamlandi { background: #dcfce7; color: #15803d; }
    .badge.iptal      { background: #fee2e2; color: #b91c1c; }

    .del-btn {
      background: none; border: none; color: #9ca3af; cursor: pointer;
      font-size: 1rem; padding: 4px 8px; border-radius: 5px;
    }
    .del-btn:hover { color: #dc2626; background: #fee2e2; }

    .toolbar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .toolbar input, .toolbar select {
      padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 7px;
      font-size: .88rem; color: #374151;
    }
    .toolbar input:focus, .toolbar select:focus { outline: none; border-color: #1e3a5f; }
  </style>
</head>
<body>

<header>
  <h1>Müşteri Dashboard</h1>
  <span id="today" style="font-size:.85rem;opacity:.8"></span>
</header>

<div class="container">

  <div class="stats">
    <div class="stat-card"><div class="label">Toplam Müşteri</div><div class="value" id="s-total">0</div></div>
    <div class="stat-card"><div class="label">Yeni</div><div class="value" id="s-yeni">0</div></div>
    <div class="stat-card"><div class="label">Görüşme</div><div class="value yellow" id="s-gorusme">0</div></div>
    <div class="stat-card"><div class="label">Tamamlandı</div><div class="value green" id="s-tamamlandi">0</div></div>
    <div class="stat-card"><div class="label">İptal</div><div class="value red" id="s-iptal">0</div></div>
  </div>

  <div class="card">
    <h2>Yeni Müşteri Ekle</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Müşteri Adı</label>
        <input id="f-name" type="text" placeholder="Ad Soyad" />
      </div>
      <div class="form-group">
        <label>Telefon</label>
        <input id="f-phone" type="tel" placeholder="05XX XXX XX XX" />
      </div>
      <div class="form-group">
        <label>Reklam Kaynağı</label>
        <select id="f-source">
          <option value="">Seçiniz</option>
          <option>Google Ads</option>
          <option>Facebook</option>
          <option>Instagram</option>
          <option>TikTok</option>
          <option>Tavsiye</option>
          <option>Organik</option>
          <option>Diğer</option>
        </select>
      </div>
      <div class="form-group">
        <label>Durum</label>
        <select id="f-status">
          <option value="yeni">Yeni</option>
          <option value="gorusme">Görüşme</option>
          <option value="tamamlandi">Tamamlandı</option>
          <option value="iptal">İptal</option>
        </select>
      </div>
    </div>
    <button class="btn" onclick="addCustomer()">Ekle</button>
  </div>

  <div class="card">
    <h2>Müşteri Listesi</h2>
    <div class="toolbar">
      <input id="search" type="text" placeholder="Ara..." oninput="render()" style="flex:1;min-width:160px" />
      <select id="filter-source" onchange="render()">
        <option value="">Tüm Kaynaklar</option>
        <option>Google Ads</option>
        <option>Facebook</option>
        <option>Instagram</option>
        <option>TikTok</option>
        <option>Tavsiye</option>
        <option>Organik</option>
        <option>Diğer</option>
      </select>
      <select id="filter-status" onchange="render()">
        <option value="">Tüm Durumlar</option>
        <option value="yeni">Yeni</option>
        <option value="gorusme">Görüşme</option>
        <option value="tamamlandi">Tamamlandı</option>
        <option value="iptal">İptal</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Müşteri Adı</th>
            <th>Telefon</th>
            <th>Reklam Kaynağı</th>
            <th>Durum</th>
            <th>Tarih</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const LABELS = { yeni:'Yeni', gorusme:'Görüşme', tamamlandi:'Tamamlandı', iptal:'İptal' };

  let customers = JSON.parse(localStorage.getItem('customers') || '[]');

  document.getElementById('today').textContent = new Date().toLocaleDateString('tr-TR', {day:'numeric',month:'long',year:'numeric'});

  function save() { localStorage.setItem('customers', JSON.stringify(customers)); }

  function addCustomer() {
    const name   = document.getElementById('f-name').value.trim();
    const phone  = document.getElementById('f-phone').value.trim();
    const source = document.getElementById('f-source').value;
    const status = document.getElementById('f-status').value;

    if (!name || !phone || !source) { alert('Lütfen tüm alanları doldurun.'); return; }

    customers.unshift({ id: Date.now(), name, phone, source, status, date: new Date().toLocaleDateString('tr-TR') });
    save();
    render();

    document.getElementById('f-name').value = '';
    document.getElementById('f-phone').value = '';
    document.getElementById('f-source').value = '';
    document.getElementById('f-status').value = 'yeni';
  }

  function deleteCustomer(id) {
    if (!confirm('Müşteri silinsin mi?')) return;
    customers = customers.filter(c => c.id !== id);
    save();
    render();
  }

  function changeStatus(id, val) {
    const c = customers.find(c => c.id === id);
    if (c) { c.status = val; save(); render(); }
  }

  function render() {
    const q  = document.getElementById('search').value.toLowerCase();
    const fs = document.getElementById('filter-source').value;
    const fd = document.getElementById('filter-status').value;

    const filtered = customers.filter(c =>
      (!q  || c.name.toLowerCase().includes(q) || c.phone.includes(q)) &&
      (!fs || c.source === fs) &&
      (!fd || c.status === fd)
    );

    document.getElementById('s-total').textContent      = customers.length;
    document.getElementById('s-yeni').textContent       = customers.filter(c=>c.status==='yeni').length;
    document.getElementById('s-gorusme').textContent    = customers.filter(c=>c.status==='gorusme').length;
    document.getElementById('s-tamamlandi').textContent = customers.filter(c=>c.status==='tamamlandi').length;
    document.getElementById('s-iptal').textContent      = customers.filter(c=>c.status==='iptal').length;

    const tbody = document.getElementById('tbody');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#9ca3af;padding:24px">Kayıt bulunamadı.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map((c, i) => `
      <tr>
        <td style="color:#9ca3af">${i+1}</td>
        <td><strong>${esc(c.name)}</strong></td>
        <td>${esc(c.phone)}</td>
        <td>${esc(c.source)}</td>
        <td>
          <select onchange="changeStatus(${c.id}, this.value)" style="border:none;background:none;font-size:.85rem;font-weight:600;cursor:pointer;color:inherit">
            ${Object.entries(LABELS).map(([v,l])=>`<option value="${v}" ${c.status===v?'selected':''}>${l}</option>`).join('')}
          </select>
          <span class="badge ${c.status}">${LABELS[c.status]}</span>
        </td>
        <td style="color:#9ca3af;font-size:.82rem">${c.date}</td>
        <td><button class="del-btn" onclick="deleteCustomer(${c.id})" title="Sil">&#10005;</button></td>
      </tr>
    `).join('');
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
</script>
</body>
</html>
